<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entry External Runner</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            width: 300px;
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.08);
        }

        .title {
            font-size: 19px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .subtitle {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 18px;
        }

        .status-box {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 13px;
            border-radius: 12px;
            background: #f3f4f6;
            margin-bottom: 16px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #9ca3af;
        }

        .status-text {
            font-size: 14px;
            font-weight: 600;
        }

        .buttons {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            border: 0;
            border-radius: 11px;
            padding: 11px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.15s;
        }

        button:hover {
            transform: translateY(-1px);
        }

        #run {
            background: #2563eb;
            color: white;
        }

        #stop {
            background: #e5e7eb;
            color: #374151;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="title">
        Entry External Runner
    </div>

    <div class="subtitle">
        외부 실행 프로그램
    </div>

    <div class="status-box">
        <div id="statusDot" class="status-dot"></div>

        <div id="status" class="status-text">
            상태: 대기 중
        </div>
    </div>

    <div class="buttons">
        <button id="run">실행</button>
        <button id="stop">정지</button>
    </div>

</div>

<script src="popup.js"></script>

</body>
</html>
